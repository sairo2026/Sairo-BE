spring:
  application:
    name: sairo-be

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

sairo:
  public-link:
    hmac-secret: ${PUBLIC_LINK_HMAC_SECRET:sairo-local-dev-hmac-secret-do-not-use-in-prod}

server:
  servlet:
    session:
      timeout: 14d

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health