spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}

  # Flyway runs separately via the "migrate" profile (see application-migrate.yml).
  flyway:
    enabled: false

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI_PROD}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://app.sairo.agency}
