spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}

  session:
    data:
      redis:
        configure-action: none

  # Flyway runs separately via the "migrate" profile (see application-migrate.yml).
  flyway:
    enabled: false

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI_PROD}

sairo:
  public-link:
    hmac-secret: ${PUBLIC_LINK_HMAC_SECRET}
  security:
    ticket-secret: ${AUTH_TICKET_SECRET}
    rate-limit-hmac-secret: ${AUTH_RATE_LIMIT_HMAC_SECRET}
    kakao-key-hmac-secret: ${AUTH_KAKAO_KEY_HMAC_SECRET}
    unsubscribe-secret: ${AUTH_UNSUBSCRIBE_SECRET}
    kakao-key-encryption-secret: ${AUTH_KAKAO_KEY_ENCRYPTION_SECRET}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://app.sairo.agency}
