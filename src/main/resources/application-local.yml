spring:
  datasource:
    url: jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:sairo}
    username: ${LOCAL_DB_USERNAME:sairo_local}
    password: ${LOCAL_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI_LOCAL}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
