services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
