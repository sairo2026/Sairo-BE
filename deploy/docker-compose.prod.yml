# The api runs as one of two interchangeable slots with the same image. `api`
# publishes host port 8080 and `api-alt` publishes 8081. deploy.sh starts the
# idle slot with the new image, waits until it is ready, points nginx at it and
# only then stops the other slot, so a deploy never leaves nginx without an
# answering backend. In steady state only one slot runs.
x-api-slot: &api-slot
  image: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
  restart: unless-stopped
  # Lets in-flight requests finish after SIGTERM (server.shutdown=graceful).
  stop_grace_period: 40s
  environment:
    SPRING_PROFILES_ACTIVE: prod
    REDIS_HOST: redis
    AWS_REGION: ap-northeast-2
  env_file:
    - path: ./env/app.env
      format: raw
  volumes:
    - bootstrap-data:/var/sairo/bootstrap
  depends_on:
    redis:
      condition: service_healthy
    scanner:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  api:
    <<: *api-slot
    ports:
      - "127.0.0.1:8080:8080"

  api-alt:
    <<: *api-slot
    ports:
      - "127.0.0.1:8081:8080"

  # Session and short-lived login state store. Not published to the host;
  # only the api container reaches it over the compose network. The image is
  # pinned by digest so a redeploy cannot silently change the server version;
  # raise the tag and the digest together when updating.
  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # REDIS_PASSWORD comes from env/redis.env, which deploy.sh writes from the
    # redisPassword field of sairo/be/app-secrets. When it is empty or the file
    # is absent Redis starts without authentication, as before. The password is
    # appended to the command at start so it never appears in this file or in
    # `docker inspect`. docker-entrypoint.sh is kept so Redis still drops root.
    entrypoint:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi; exec docker-entrypoint.sh "$$@"'
      - redis-entrypoint
    env_file:
      - path: ./env/redis.env
        format: raw
        required: false
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Egx
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - '[ -z "$$REDIS_PASSWORD" ] || export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5

  scanner:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav

  # One-off migration step. `profiles` keeps it out of a bare `docker compose
  # up`; deploy.sh always targets it explicitly via `run --rm migrate`, which
  # activates its profile automatically regardless.
  migrate:
    image: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
    profiles: ["migration"]
    environment:
      SPRING_PROFILES_ACTIVE: migrate
    env_file:
      - path: ./env/migrate.env
        format: raw
    restart: "no"

volumes:
  bootstrap-data:
  redis-data:
  clamav-data:
