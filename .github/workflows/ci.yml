name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security watch unit tests
        run: python3 deploy/scripts/tests/test_security_watch.py -v

      - name: Lint deploy script
        run: shellcheck deploy/deploy.sh

      - name: Run deploy script tests
        run: python3 deploy/scripts/tests/test_deploy_script.py -v

      - name: Run Redis compose authentication tests
        run: python3 deploy/scripts/tests/test_redis_compose.py -v

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          cache: gradle

      - name: Verify patched JDK
        run: |
          version="$(java -version 2>&1)"
          printf '%s\n' "$version"
          grep -Fq 'Temurin-21.0.13.1+2' <<<"$version"

      - name: Run quality checks and tests
        run: ./gradlew check --no-daemon
